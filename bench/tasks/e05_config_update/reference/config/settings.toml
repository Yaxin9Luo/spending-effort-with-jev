# Orders service configuration

[server]
host = "0.0.0.0"
port = 8080
workers = 4

[database]
url = "postgresql://localhost:5432/orders"
pool_size = 20
timeout_seconds = 30

[logging]
level = "WARNING"
format = "%(asctime)s %(levelname)s %(name)s: %(message)s"

[cache]
backend = "redis"
url = "redis://localhost:6379/0"
ttl_seconds = 300
